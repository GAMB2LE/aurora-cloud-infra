name: validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ansible:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked control environment
        run: uv sync --locked
      - name: Install Ansible collections
        run: uv run ansible-galaxy collection install -r requirements.yml
      - name: Check changed files for whitespace errors
        run: git diff --check HEAD^1...HEAD
      - name: Validate inventory
        run: uv run ansible-inventory --list >/dev/null
      - name: Validate playbooks
        run: |
          for playbook in playbooks/*.yml; do
            echo "Validating ${playbook}"
            uv run ansible-playbook "${playbook}" --syntax-check
          done

  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Build documentation strictly
        run: python -m mkdocs build --strict

  archive-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: archive-python
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: roles/object_store_mirror/files/aurora-object-store-recovery-requirements.txt
      - name: Install the locked production archive runtime
        run: |
          python -m pip install --require-hashes --only-binary=:all: \
            -r roles/object_store_mirror/files/aurora-object-store-recovery-requirements.txt
          python -m pip check
      - name: Compile archive programs for the production Python version
        run: python -m compileall -q roles/object_store_mirror/files roles/source_sync/files scripts/deploy_hatpro_discovery.py
      - name: Test archive recovery and existing operational contracts
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test protected hardlinks across the root and worker UID boundary
        run: |
          sudo -- "${{ steps.archive-python.outputs.python-path }}" - <<'PY'
          import sys
          import unittest

          sys.path.insert(0, "tests")
          suite = unittest.defaultTestLoader.loadTestsFromName(
              "test_object_store_evidence.EvidencePublicationTests."
              "test_real_cross_uid_publication_preserves_root_owned_canonical_artifacts"
          )
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          # This privileged regression must execute, not silently skip.
          raise SystemExit(0 if result.wasSuccessful() and not result.skipped else 1)
          PY
