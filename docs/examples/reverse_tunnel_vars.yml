---
# Example only: public keys and fingerprints. Use a DIFFERENT key set for each
# cloud. The corresponding private keys remain on their individual edge hosts.

edge_tunnel_server_enabled: true

edge_tunnel_server_manage_sshd_config: true
edge_tunnel_server_replace_authorized_keys: false
edge_tunnel_server_status_timer_enabled: true
edge_tunnel_server_authorized_keys:
  - name: ass-linux-digitalocean
    key: "ssh-ed25519 REPLACE_WITH_PUBLIC_KEY"
    listen_ports: ["127.0.0.1:2201", "127.0.0.1:2401"]
  - name: aps-linux-digitalocean
    key: "ssh-ed25519 REPLACE_WITH_PUBLIC_KEY"
    listen_ports: ["127.0.0.1:2202", "127.0.0.1:2402"]
  - name: ass-proxmox-digitalocean
    key: "ssh-ed25519 REPLACE_WITH_PUBLIC_KEY"
    listen_ports: ["127.0.0.1:2211"]
  - name: aps-proxmox-digitalocean
    key: "ssh-ed25519 REPLACE_WITH_PUBLIC_KEY"
    listen_ports: ["127.0.0.1:2212"]

# Collect independently through existing trusted access, not ssh-keyscan of the
# new loopback endpoint. Unconfigured fingerprints remain unverified.
edge_tunnel_server_expected_host_fingerprints:
  ass-linux: "SHA256:REPLACE_WITH_TRUSTED_ED25519_FINGERPRINT"
  aps-linux: "SHA256:REPLACE_WITH_TRUSTED_ED25519_FINGERPRINT"
  ass-proxmox: "SHA256:REPLACE_WITH_TRUSTED_ED25519_FINGERPRINT"
  aps-proxmox: "SHA256:REPLACE_WITH_TRUSTED_ED25519_FINGERPRINT"

# Recovery access does not switch production data transport.
edge_source_sync_use_reverse_tunnels: false
