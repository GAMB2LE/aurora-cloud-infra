[project]
name = "aurora-cloud-infra"
version = "0.1.0"
description = "Ansible control project for the Aurora cloud data and presentation hosts"
requires-python = ">=3.12"
dependencies = [
  "ansible==13.6.0",
]

[dependency-groups]
test = [
  "pytest>=8,<10",
  "pandas==2.3.3",
  "xarray==2025.6.1",
  "zarr==2.18.3",
  "numcodecs==0.13.1",
]

[tool.uv]
package = false
