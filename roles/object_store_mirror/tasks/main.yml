---
- name: Ensure object-store runtime directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ object_store_manifest_root }}", owner: "{{ aurora_service_user }}", group: "{{ aurora_service_group }}", mode: "0755" }
    - { path: "{{ object_store_log_root }}", owner: "{{ aurora_service_user }}", group: "{{ aurora_service_group }}", mode: "0755" }
    - { path: "{{ object_store_cache_root }}", owner: "{{ aurora_service_user }}", group: "{{ aurora_service_group }}", mode: "0755" }
    - { path: "{{ object_store_repair_state_root }}", owner: "{{ aurora_service_user }}", group: "{{ aurora_service_group }}", mode: "0755" }
    - { path: /etc/aurora-object-store, owner: root, group: "{{ aurora_service_group }}", mode: "0750" }
    - { path: "{{ aurora_state_root }}/object-store-verification-gate", owner: root, group: root, mode: "0755" }
    - { path: "{{ object_store_recovery_root }}", owner: "{{ aurora_service_user }}", group: "{{ aurora_service_group }}", mode: "2770" }
    - { path: /usr/local/lib/aurora-object-store, owner: root, group: root, mode: "0755" }
    - { path: "{{ object_store_recovery_runtime }}", owner: root, group: root, mode: "0755" }
  when: object_store_mirror_enabled | bool

- name: Install object-store catalogue
  ansible.builtin.template:
    src: object-store-catalog.json.j2
    dest: /etc/aurora-object-store/catalog.json
    owner: root
    group: "{{ aurora_service_group }}"
    mode: "0640"
  when: object_store_mirror_enabled | bool

- name: Install object-store copy wrappers
  ansible.builtin.template:
    src: aurora-object-store-copy.j2
    dest: "/usr/local/bin/aurora-object-store-copy-{{ item.name }}"
    owner: root
    group: root
    mode: "0755"
  loop: "{{ object_store_jobs }}"
  when: object_store_mirror_enabled | bool

- name: Install object-store copy units
  ansible.builtin.template:
    src: "{{ item.1 }}.j2"
    dest: "/etc/systemd/system/aurora-object-store-copy-{{ item.0.name }}.{{ item.1 }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ object_store_jobs | product(['service', 'timer']) | list }}"
  when: object_store_mirror_enabled | bool

- name: Install object-store inventory and verification programs
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - { src: aurora-object-store-inventory.py, dest: /usr/local/bin/aurora-object-store-inventory }
    - { src: aurora-object-store-verification-gate.py, dest: /usr/local/sbin/aurora-object-store-verification-gate }
    - { src: aurora-object-store-repair-from-report.py, dest: /usr/local/bin/aurora-object-store-repair-from-report }
    - { src: aurora-object-store-recheck-after-repair.py, dest: /usr/local/bin/aurora-object-store-recheck-after-repair }
    - { src: aurora-object-store-trigger-retention.py, dest: /usr/local/sbin/aurora-object-store-trigger-retention }
  when: object_store_mirror_enabled | bool

- name: Install object-store inventory and verification units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - aurora-object-store-inventory.service
    - aurora-object-store-inventory-incremental@.service
    - aurora-object-store-inventory-incremental@.timer
    - aurora-object-store-inventory.timer
    - aurora-object-store-verification-gate.service
    - aurora-object-store-verification-gate.path
    - aurora-object-store-repair.service
    - aurora-object-store-repair.path
    - aurora-object-store-recheck-after-repair.service
    - aurora-object-store-recovery.service
    - aurora-object-store-recovery.timer
    - aurora-object-store-recovery-worker@.service
    - aurora-object-store-recovery-upload.service
    - aurora-object-store-recovery-upload.timer
  when: object_store_mirror_enabled | bool

- name: Install recovery modules together for stable sibling imports
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/usr/local/lib/aurora-object-store/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { src: aurora_object_store_recovery.py, dest: aurora_object_store_recovery.py }
    - { src: aurora_object_store_s3.py, dest: aurora_object_store_s3.py }
    - { src: aurora_object_store_evidence.py, dest: aurora_object_store_evidence.py }
    - { src: aurora_object_store_acceptance.py, dest: aurora_object_store_acceptance.py }
    - { src: aurora-object-store-inventory.py, dest: aurora_object_store_inventory.py }
    - { src: aurora-object-store-verification-gate.py, dest: aurora_object_store_verification_gate.py }
    - { src: aurora-object-store-verification-gate.py, dest: aurora-object-store-verification-gate.py }
  when: object_store_mirror_enabled | bool

- name: Install hash-locked recovery runtime requirements
  ansible.builtin.copy:
    src: aurora-object-store-recovery-requirements.txt
    dest: "{{ object_store_recovery_runtime }}/requirements.txt"
    owner: root
    group: root
    mode: "0644"
  register: object_store_recovery_requirements
  when: object_store_mirror_enabled | bool

- name: Create dedicated recovery virtual environment
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -m
      - venv
      - "{{ object_store_recovery_runtime }}/venv"
    creates: "{{ object_store_recovery_runtime }}/venv/bin/python"
  register: object_store_recovery_venv
  when: object_store_mirror_enabled | bool

- name: Install locked recovery reader dependencies
  ansible.builtin.command:
    argv:
      - "{{ object_store_recovery_runtime }}/venv/bin/python"
      - -m
      - pip
      - install
      - --require-hashes
      - --only-binary=:all:
      - --requirement
      - "{{ object_store_recovery_runtime }}/requirements.txt"
  when:
    - object_store_mirror_enabled | bool
    - object_store_recovery_requirements.changed or object_store_recovery_venv.changed
    - not ansible_check_mode

- name: Install recovery entry point using its dedicated runtime
  ansible.builtin.template:
    src: aurora-object-store-recovery.j2
    dest: /usr/local/bin/aurora-object-store-recovery
    owner: root
    group: root
    mode: "0755"
  when: object_store_mirror_enabled | bool

- name: Find obsolete object-store unit backup files
  ansible.builtin.find:
    paths: /etc/systemd/system
    patterns: "aurora-object-store-*.before-*"
    file_type: file
    recurse: false
  register: object_store_obsolete_unit_backups
  when: object_store_mirror_enabled | bool

- name: Remove obsolete object-store unit backup files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ object_store_obsolete_unit_backups.files | default([]) }}"
  when: object_store_mirror_enabled | bool

- name: Find obsolete object-store program backup files
  ansible.builtin.find:
    paths: /usr/local/bin
    patterns: "aurora-object-store-*.before-*"
    file_type: file
    recurse: false
  register: object_store_obsolete_program_backups
  when: object_store_mirror_enabled | bool

- name: Remove obsolete object-store program backup files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ object_store_obsolete_program_backups.files | default([]) }}"
  when: object_store_mirror_enabled | bool

- name: Enable routine object-store copy timers
  ansible.builtin.systemd:
    name: "aurora-object-store-copy-{{ item.name }}.timer"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ object_store_jobs }}"
  when:
    - object_store_mirror_enabled | bool
    - object_store_mirror_timer_enabled | bool
    - not ansible_check_mode

- name: Disable routine object-store copy timers when requested
  ansible.builtin.systemd:
    name: "aurora-object-store-copy-{{ item.name }}.timer"
    enabled: false
    state: stopped
    daemon_reload: true
  loop: "{{ object_store_jobs }}"
  when:
    - object_store_mirror_enabled | bool
    - not object_store_mirror_timer_enabled | bool
    - not ansible_check_mode

- name: Enable object-store inventory and evidence watcher
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - aurora-object-store-inventory.timer
    - aurora-object-store-verification-gate.path
    - aurora-object-store-repair.path
  when:
    - object_store_mirror_enabled | bool
    - not ansible_check_mode

- name: Keep legacy raw scheduling only when recovery is disabled
  ansible.builtin.systemd:
    name: aurora-object-store-inventory-incremental@raw.timer
    enabled: "{{ not object_store_recovery_enabled | bool }}"
    state: "{{ 'stopped' if object_store_recovery_enabled | bool else 'started' }}"
    daemon_reload: true
  when:
    - object_store_mirror_enabled | bool
    - not ansible_check_mode

- name: Apply automatic recovery scheduling policy
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: "{{ object_store_recovery_enabled | bool }}"
    state: "{{ 'started' if object_store_recovery_enabled | bool else 'stopped' }}"
    daemon_reload: true
  loop:
    - aurora-object-store-recovery.timer
    - aurora-object-store-recovery-upload.timer
  when:
    - object_store_mirror_enabled | bool
    - not ansible_check_mode
