---
- name: Ensure dual-archive dispatch directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ archive_dispatch_state_root }}", owner: "{{ aurora_service_user }}", group: "{{ aurora_service_group }}", mode: "0755" }
    - { path: "{{ archive_dispatch_state_root }}/receipts", owner: "{{ aurora_service_user }}", group: "{{ aurora_service_group }}", mode: "0755" }
    - { path: /etc/aurora-archive-dispatch, owner: root, group: "{{ aurora_service_group }}", mode: "0750" }
  when: archive_dispatch_enabled | bool

- name: Install dual-archive dispatch program
  ansible.builtin.copy:
    src: aurora-archive-dispatch.py
    dest: /usr/local/bin/aurora-archive-dispatch
    owner: root
    group: root
    mode: "0755"
  when: archive_dispatch_enabled | bool

- name: Install guarded cloud cache cleanup program
  ansible.builtin.copy:
    src: aurora-cloud-cache-cleanup.py
    dest: /usr/local/sbin/aurora-cloud-cache-cleanup
    owner: root
    group: root
    mode: "0755"
  when: archive_dispatch_enabled | bool

- name: Install dual-archive dispatch configuration
  ansible.builtin.template:
    src: config.json.j2
    dest: /etc/aurora-archive-dispatch/config.json
    owner: root
    group: "{{ aurora_service_group }}"
    mode: "0640"
  when: archive_dispatch_enabled | bool

- name: Install dual-archive dispatch systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - aurora-archive-dispatch.service
    - aurora-archive-dispatch.timer
  when: archive_dispatch_enabled | bool

- name: Enable newest-first dual-archive delivery
  ansible.builtin.systemd:
    name: aurora-archive-dispatch.timer
    enabled: true
    state: started
    daemon_reload: true
  when:
    - archive_dispatch_enabled | bool
    - archive_dispatch_timer_enabled | bool
    - not ansible_check_mode

- name: Disable newest-first dual-archive delivery when requested
  ansible.builtin.systemd:
    name: aurora-archive-dispatch.timer
    enabled: false
    state: stopped
    daemon_reload: true
  when:
    - archive_dispatch_enabled | bool
    - not archive_dispatch_timer_enabled | bool
    - not ansible_check_mode
