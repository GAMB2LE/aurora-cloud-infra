---
- name: Ensure BLE raw directory exists
  ansible.builtin.file:
    path: "{{ aurora_paths.raw_blesensors }}"
    state: directory
    owner: "{{ aurora_service_user }}"
    group: "{{ aurora_service_group }}"
    mode: "02775"
  when: blesensors_source_sync_enabled | bool

# Existing hosts share this directory with other streams. Keep their deployed
# ownership and permissions; only create it during a first installation.
- name: Check the shared state directory
  ansible.builtin.stat:
    path: "{{ aurora_state_root }}"
  register: blesensors_state_directory
  when: blesensors_source_sync_enabled | bool

- name: Create state directory only when absent
  ansible.builtin.file:
    path: "{{ aurora_state_root }}"
    state: directory
    owner: "{{ aurora_service_user }}"
    group: "{{ aurora_service_group }}"
    mode: "02775"
  when:
    - blesensors_source_sync_enabled | bool
    - not blesensors_state_directory.stat.exists

- name: Check BLE can use the deployed state directory
  ansible.builtin.command:
    argv: [test, -w, "{{ aurora_state_root }}"]
  become_user: "{{ aurora_service_user }}"
  changed_when: false
  check_mode: false
  when:
    - blesensors_source_sync_enabled | bool
    - blesensors_state_directory.stat.exists

- name: Install BLE source sync script
  ansible.builtin.template:
    src: aurora-blesensors-sync.j2
    dest: /usr/local/bin/aurora-blesensors-sync
    owner: root
    group: root
    mode: "0755"
    backup: true
    validate: /bin/bash -n %s
  when: blesensors_source_sync_enabled | bool

- name: Install BLE source sync units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  loop:
    - aurora-blesensors-source-sync.service
    - aurora-blesensors-source-sync.timer
  when: blesensors_source_sync_enabled | bool

- name: Apply BLE source timer state
  ansible.builtin.systemd:
    name: aurora-blesensors-source-sync.timer
    enabled: "{{ blesensors_source_sync_timer_enabled | bool }}"
    state: "{{ 'started' if blesensors_source_sync_timer_enabled | bool else 'stopped' }}"
    daemon_reload: true
  when:
    - blesensors_source_sync_enabled | bool
    - not ansible_check_mode

- name: Disable BLE source timer when ingestion is disabled
  ansible.builtin.systemd:
    name: aurora-blesensors-source-sync.timer
    enabled: false
    state: stopped
  failed_when: false
  when:
    - not blesensors_source_sync_enabled | bool
    - not ansible_check_mode
