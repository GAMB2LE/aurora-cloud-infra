---
# Update only the presentation reader after recovery is already active.
# Existing archive configuration and worker state remain authoritative.
# Supply a unique archive_recovery_health_release for the verified rollback.
# A changed reader records a manual intervention, restarting acceptance only.
- name: Update archive recovery health presentation without touching workers
  hosts: aurora-cloud
  become: true
  vars:
    object_store_recovery_enabled: true
    archive_recovery_health_refresh: false
  tasks:
    - name: Preserve the deployed archive configuration for rendering
      ansible.builtin.import_tasks: tasks/archive_recovery_context.yml

    - name: Require active recovery before updating its health presentation
      ansible.builtin.assert:
        that:
          - archive_recovery_live_catalog.recovery_enabled | default(false) | bool
          - archive_recovery_health_release | default('') is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$')
        fail_msg: This focused presentation update requires recovery to be active.

    - name: Select a restricted release-specific rollback directory
      ansible.builtin.set_fact:
        archive_recovery_health_backup: "/var/lib/aurora-cloud/recovery-rollbacks/health-{{ archive_recovery_health_release }}"

    - name: Inspect the reader and rollback destination without following links
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
        follow: false
      loop:
        - /usr/local/bin/aurora-archive-health
        - "{{ archive_recovery_health_backup }}"
      register: archive_recovery_health_before

    - name: Require a root-owned regular reader and a new rollback destination
      ansible.builtin.assert:
        that:
          - archive_recovery_health_before.results[0].stat.isreg | default(false)
          - not archive_recovery_health_before.results[0].stat.islnk | default(false)
          - archive_recovery_health_before.results[0].stat.uid == 0
          - not archive_recovery_health_before.results[1].stat.exists

    - name: Save and verify the exact reader before publication
      when: not ansible_check_mode
      block:
        - name: Ensure the restricted rollback parent exists
          ansible.builtin.file:
            path: /var/lib/aurora-cloud/recovery-rollbacks
            state: directory
            owner: root
            group: root
            mode: '0700'

        - name: Exclusively create this release rollback directory
          ansible.builtin.command:
            argv: [/usr/bin/mkdir, -m, '0700', "{{ archive_recovery_health_backup }}"]

        - name: Preserve the previous reader
          ansible.builtin.copy:
            src: /usr/local/bin/aurora-archive-health
            dest: "{{ archive_recovery_health_backup }}/aurora-archive-health.before"
            remote_src: true
            owner: root
            group: root
            mode: '0600'
            force: false
            unsafe_writes: false

        - name: Hash the rollback copy
          ansible.builtin.stat:
            path: "{{ archive_recovery_health_backup }}/aurora-archive-health.before"
            checksum_algorithm: sha256
          register: archive_recovery_health_saved

        - name: Verify saved bytes and permissions before publication
          ansible.builtin.assert:
            that:
              - archive_recovery_health_saved.stat.checksum == archive_recovery_health_before.results[0].stat.checksum
              - archive_recovery_health_saved.stat.mode == '0600'
              - archive_recovery_health_saved.stat.uid == 0
              - archive_recovery_health_saved.stat.gid == 0

        - name: Record original restoration metadata
          ansible.builtin.copy:
            content: "{{ archive_recovery_health_before.results[0].stat | to_nice_json }}\n"
            dest: "{{ archive_recovery_health_backup }}/before.json"
            owner: root
            group: root
            mode: '0600'
            force: false
            unsafe_writes: false

    - name: Recheck the live reader and catalogue before publication
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
        follow: false
      loop:
        - /usr/local/bin/aurora-archive-health
        - /etc/aurora-object-store/catalog.json
      register: archive_recovery_health_unchanged

    - name: Reject a concurrent reader or catalogue update
      ansible.builtin.assert:
        that:
          - archive_recovery_health_unchanged.results[0].stat.isreg | default(false)
          - archive_recovery_health_unchanged.results[0].stat.checksum == archive_recovery_health_before.results[0].stat.checksum
          - archive_recovery_health_unchanged.results[1].stat.checksum == (archive_recovery_catalog_bytes.content | b64decode | hash('sha256'))
      no_log: true

    - name: Install only the archive health reader
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/operations_monitor/templates/aurora-archive-health.py.j2"
        dest: /usr/local/bin/aurora-archive-health
        owner: root
        group: root
        mode: '0755'
        unsafe_writes: false
        validate: /usr/bin/python3 -c "import pathlib, sys; compile(pathlib.Path(sys.argv[1]).read_bytes(), sys.argv[1], 'exec')" "%s"
      register: archive_recovery_health_installed

    - name: Record corrective deployment without changing jobs or confirmations
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -B
          - -c
          - |
            import json, sys
            from pathlib import Path
            sys.path.insert(0, '/usr/local/lib/aurora-object-store')
            from aurora_object_store_recovery import Queue
            config = json.loads(Path('/etc/aurora-object-store/catalog.json').read_bytes())
            queue = Queue(config)
            try:
                queue.record_manual_intervention()
                status = queue.status()
                print(json.dumps({key: status[key] for key in
                    ('manual_intervention_count', 'last_manual_intervention_at')}))
            finally:
                queue.close()
      when:
        - archive_recovery_health_installed.changed
        - not ansible_check_mode

    - name: Optionally refresh the existing health service
      ansible.builtin.systemd:
        name: aurora-archive-health.service
        state: started
      when:
        - archive_recovery_health_refresh | bool
        - not ansible_check_mode
