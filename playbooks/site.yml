---
- name: Configure Aurora cloud dashboard host
  hosts: aurora_cloud
  become: true
  roles:
    - base
    - uv
    - security
    - storage
    - tailscale
    - edge_tunnel_server
    - source_sync
    - dashboard_app
    - dashboard_services
    - nginx
    - gws_sync
    - object_store_mirror
    - ass_retention
    - operations_monitor
    - standby_replication
